name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enables GitHub Pages on fresh repositories
          # (fixes "Get Pages site failed: Not Found").
          enablement: true
      - name: Prepare public site
        run: |
          mkdir -p public
          cp -r index.html about resume game ru css js assets favicon.svg robots.txt sitemap.xml BingSiteAuth.xml googlee26a7f172485daa4.html yandex_e492c0d3d0daa2af.html public/
          mkdir -p public/.well-known
          cp .well-known/discord public/.well-known/discord
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          include-hidden-files: true
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
